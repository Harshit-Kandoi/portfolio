<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Harshit Kandoi</title>
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />
    <style>
      :root { --bg: #f7f4ed; --ink: #241f19; --muted: #695f53; --accent: #ff6f36; --line: rgba(36, 31, 25, 0.12); }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #141311; --ink: #f4ebdd; --muted: #b9ac9b; --accent: #ff8b57; --line: rgba(239, 228, 207, 0.12); }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--bg); color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 520px; }
      .code { font-size: 13px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
      h1 { margin: 10px 0 12px; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
      a.button {
        display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 8px;
        background: var(--accent); color: #1b120c; font-weight: 700; text-decoration: none;
      }
      a.button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404 · Not found</div>
      <h1>This page doesn't exist.</h1>
      <p>The link may be old or mistyped. Everything lives on the portfolio home page.</p>
      <a class="button" href="/portfolio/">Go to the portfolio →</a>
    </main>
  </body>
</html>
