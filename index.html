<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags (keep in sync with src/data/config.ts — checked by src/__tests__/seo.test.ts) -->
    <title>Harshit Kandoi — Software Engineer · Full Stack &amp; Google Cloud</title>
    <meta name="description" content="Harshit Kandoi is an Associate Software Engineer at ThoughtIn Solutions, building full stack web apps, Google Cloud workflows and AI tools with React, Python and Java." />
    <meta name="author" content="Harshit Kandoi" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.harshitkandoi.in/portfolio/" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://www.harshitkandoi.in/portfolio/" />
    <meta property="og:title" content="Harshit Kandoi — Software Engineer · Full Stack &amp; Google Cloud" />
    <meta property="og:description" content="Harshit Kandoi is an Associate Software Engineer at ThoughtIn Solutions, building full stack web apps, Google Cloud workflows and AI tools with React, Python and Java." />
    <meta property="og:image" content="https://www.harshitkandoi.in/portfolio/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Harshit Kandoi — Software Engineer portfolio" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Harshit Kandoi" />
    <meta property="profile:first_name" content="Harshit" />
    <meta property="profile:last_name" content="Kandoi" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Harshit78500" />
    <meta name="twitter:creator" content="@Harshit78500" />
    <meta name="twitter:title" content="Harshit Kandoi — Software Engineer · Full Stack &amp; Google Cloud" />
    <meta name="twitter:description" content="Harshit Kandoi is an Associate Software Engineer at ThoughtIn Solutions, building full stack web apps, Google Cloud workflows and AI tools with React, Python and Java." />
    <meta name="twitter:image" content="https://www.harshitkandoi.in/portfolio/og-preview.png" />
    <meta name="twitter:image:alt" content="Harshit Kandoi — Software Engineer portfolio" />

    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portfolio OS" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Profile photo is in the classic hero card -->
    <link rel="preload" as="image" href="/profile.webp" type="image/webp" />

    <!-- Fonts and Icons: preload then swap in async to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter (UI) + Fira Code (monospace / terminal) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>

    <!-- Structured Data (JSON-LD): ProfilePage + Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "url": "https://www.harshitkandoi.in/portfolio/",
      "name": "Harshit Kandoi — Portfolio",
      "mainEntity": {
        "@type": "Person",
        "@id": "https://www.harshitkandoi.in/portfolio/#person",
        "name": "Harshit Kandoi",
        "jobTitle": "Associate Software Engineer",
        "description": "Full stack software engineer working with React, Python, Java and Google Cloud.",
        "url": "https://www.harshitkandoi.in/portfolio/",
        "image": "https://www.harshitkandoi.in/portfolio/profile.webp",
        "email": "mailto:hello@harshitkandoi.in",
        "address": { "@type": "PostalAddress", "addressLocality": "Jaipur", "addressRegion": "Rajasthan", "addressCountry": "IN" },
        "worksFor": { "@type": "Organization", "name": "ThoughtIn Solutions" },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "B.K. Birla Institute of Engineering and Technology" }
        ],
        "hasCredential": [
          { "@type": "EducationalOccupationalCredential", "name": "Google Associate Cloud Engineer", "credentialCategory": "certification" }
        ],
        "sameAs": [
          "https://github.com/Harshit-Kandoi",
          "https://linkedin.com/in/harshit-kandoi",
          "https://medium.com/@kandoiharshitsdlp",
          "https://x.com/Harshit78500"
        ],
        "knowsAbout": ["Full Stack Development", "React", "Python", "Java", "Google Cloud Platform", "Cloud Functions", "Pub/Sub", "Firestore", "Machine Learning"]
      }
    }
    </script>
  </head>
  <body>
    <!-- The classic page is rendered into #root at build time (scripts/prerender.mjs), so crawlers
         and visitors without JavaScript get the full content. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
